name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: autostock
          POSTGRES_USER: autostock
          POSTGRES_PASSWORD: autostock123
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U autostock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Migrate test database
        env:
          DATABASE_URL: postgres://autostock:autostock123@localhost:5433/autostock?sslmode=disable
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz | tar xz
          ./migrate -path ./migrations -database "$DATABASE_URL" up
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          DATABASE_URL: postgres://autostock:autostock123@localhost:5433/autostock?sslmode=disable
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
