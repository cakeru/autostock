services:
  postgres:
    image: postgres:15-alpine
    container_name: autostock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autostock
      POSTGRES_USER: autostock
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autostock123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autostock"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: autostock-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://autostock:${DB_PASSWORD:-autostock123}@postgres:5432/autostock?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-production}
      # Image storage: "local" (default) writes to the uploads volume below;
      # "r2" = Cloudflare R2; "s3" = any S3-compatible bucket (fill the matching vars).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/uploads
      STORAGE_PUBLIC_URL: /uploads
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      # Folder holding the database backups written by the in-app backup
      # schedules (Settings → Backups); served by the download buttons. The
      # bind-mount below is read-write because the backend runs pg_dump itself.
      BACKUP_DIR: /backups
      # Shop timezone — cron schedules and date-sensitive logic (invoice
      # numbering) run in this zone rather than UTC.
      TZ: ${TZ:-Asia/Phnom_Penh}
      # "Update now" agent (compose service `updater`); the Settings button is
      # hidden/disabled when unset.
      UPDATER_URL: ${UPDATER_URL:-http://updater:8081}
    volumes:
      - uploads_data:/app/uploads
      - ${BACKUP_DIR:-./backups}:/backups
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: autostock-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # "Update now" agent (Settings page): holds the Docker socket + repo checkout
  # and runs deploy.sh on demand. Deliberately not rebuilt by the deploy, so it
  # survives the app restart. The repo must be public or carry credentials.
  updater:
    build:
      context: ./backend
      dockerfile: Dockerfile.updater
    container_name: autostock-updater
    restart: unless-stopped
    environment:
      UPDATER_PORT: "8081"
      # Mount target and deploy.sh working dir. Set REPO_DIR to the repo's
      # absolute host path so the deploy resolves ./backups and build contexts
      # against the same path the Docker daemon sees (required on Docker
      # Desktop for Mac; recommended everywhere).
      REPO_PATH: ${REPO_DIR:-/repo}
    volumes:
      # With REPO_DIR set, the repo is mounted at the same path it has on the
      # host; otherwise the default ./:/repo keeps local dev unchanged.
      - ${REPO_DIR:-.}:${REPO_DIR:-/repo}
      # Docker Desktop for Mac keeps the socket at ~/.docker/run/docker.sock;
      # set DOCKER_SOCKET to that path (or enable the "default socket" setting).
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
